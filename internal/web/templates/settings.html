{{define "content"}}
<h1>Settings</h1>

<section class="settings-section">
  <h2>Profile</h2>
  <p>Signed in as <strong>{{.User.Email}}</strong>.</p>
  <form class="settings-form" method="post" action="/settings/profile">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <div class="field">
      <label for="display_name">Display name</label>
      <input
        type="text"
        id="display_name"
        name="display_name"
        value="{{.User.DisplayName}}"
        maxlength="100"
        autocomplete="name"
      >
    </div>
    <button type="submit">Save profile</button>
  </form>
</section>

<section class="settings-section">
  <h2>Reader behavior</h2>
  <form class="settings-form" method="post" action="/settings/reader">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <fieldset class="field">
      <legend>External links</legend>
      <label>
        <input
          type="radio"
          name="external_links"
          value="new_tab"
          {{if eq .Reader.ExternalLinks "new_tab"}}checked{{end}}
        >
        Open in a new tab
      </label>
      <label>
        <input
          type="radio"
          name="external_links"
          value="same_tab"
          {{if eq .Reader.ExternalLinks "same_tab"}}checked{{end}}
        >
        Open in the same tab
      </label>
    </fieldset>
    <fieldset class="field">
      <legend>Images</legend>
      <label>
        <input
          type="radio"
          name="images"
          value="link"
          {{if eq .Reader.Images "link"}}checked{{end}}
        >
        Wrap in a link to the full-size file
      </label>
      <label>
        <input
          type="radio"
          name="images"
          value="plain"
          {{if eq .Reader.Images "plain"}}checked{{end}}
        >
        Show as-is
      </label>
    </fieldset>
    <button type="submit">Save reader settings</button>
  </form>
</section>

<section class="settings-section">
  <h2>Change password</h2>
  <form class="settings-form" method="post" action="/settings/password">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <div class="field">
      <label for="current_password">Current password</label>
      <input
        type="password"
        id="current_password"
        name="current_password"
        autocomplete="current-password"
        required
      >
    </div>
    <div class="field">
      <label for="password">New password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        minlength="8"
        aria-describedby="password-hint"
        required
      >
      <p class="field-hint" id="password-hint">Use at least 8 characters.</p>
    </div>
    <div class="field">
      <label for="password_confirm">Confirm new password</label>
      <input
        type="password"
        id="password_confirm"
        name="password_confirm"
        autocomplete="new-password"
        minlength="8"
        aria-describedby="password-hint"
        required
      >
    </div>
    <button type="submit">Change password</button>
  </form>
</section>
{{end}}
