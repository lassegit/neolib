{{define "layout"}}<!doctype html>
<html lang="en"{{if .Theme}} data-reader-theme="{{.Theme}}" data-reader-font="{{.FontFamily}}" style="--reader-font-size:{{.FontSize}}rem;--reader-line-height:{{.LineHeight}};--reader-measure:{{.Measure}}ch"{{end}}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="csrf-token" content="{{.CSRF}}">
    <title>{{.Title}} · neolib</title>
    <link rel="stylesheet" href="/static/global.css">
    <link rel="stylesheet" href="/static/reader/reader.css">
    {{block "styles" .}}{{end}}
    <noscript><style>.reader-sidebar { display: block; }</style></noscript>
  </head>
  <body class="page{{if .BodyClass}} {{.BodyClass}}{{end}}">
    {{if .User}}
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main">
        <ul class="site-nav-list">
          <li><a href="/">Library</a></li>
          <li><a href="/settings">Settings</a></li>
        </ul>
      </nav>
    </header>
    {{end}}
    <main id="main" class="site-main" tabindex="-1">
      {{if .Error}}
      <p class="flash flash-error" role="alert"><strong>{{.Error}}</strong></p>
      {{end}}
      {{if .Notice}}
      <p class="flash flash-notice" role="status">{{.Notice}}</p>
      {{end}}
      {{template "content" .}}
    </main>
    {{block "scripts" .}}{{end}}
  </body>
</html>
{{end}}
