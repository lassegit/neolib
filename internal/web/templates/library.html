{{define "content"}}
<section class="library">
  <h1>Library</h1>

  {{if .Books}}
  <ul class="book-list">
    {{range .Books}}
    <li class="book">
      <a class="book-link" href="/books/{{.ID}}">
        {{if .CoverMediaType}}
        <img
          class="book-cover"
          src="/books/{{.ID}}/cover"
          alt=""
          height="120"
          loading="lazy"
          decoding="async"
        >
        {{end}}
        <span class="book-title">{{.Title}}</span>
      </a>
      {{if .Author}}
      <p class="book-author">{{.Author}}</p>
      {{end}}
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty-state">Your library is empty. Import an EPUB below to get started.</p>
  {{end}}
</section>

<aside class="import">
  <h2>Add books</h2>
  <form class="import-form" method="post" action="/books" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <div class="field">
      <label for="file">EPUB files</label>
      <input
        type="file"
        id="file"
        name="file"
        accept=".epub,.zip,application/epub+zip,application/zip"
        multiple
        required
      >
    </div>
    <button type="submit">Import</button>
  </form>
</aside>
{{end}}
