{{define "content"}}
<h1>Create account</h1>

{{if .Closed}}
<p>
  Registration is closed on this server. <a href="/signin">Sign in</a> instead.
</p>
{{else}}
<form class="auth-form" method="post" action="/signup">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <div class="field">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      value="{{.Email}}"
      autocomplete="username"
      required
      autofocus
    >
  </div>
  <div class="field">
    <label for="display_name">Display name</label>
    <input
      type="text"
      id="display_name"
      name="display_name"
      value="{{.DisplayName}}"
      maxlength="100"
      autocomplete="name"
    >
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      autocomplete="new-password"
      minlength="8"
      aria-describedby="password-hint"
      required
    >
    <p class="field-hint" id="password-hint">Use at least 8 characters.</p>
  </div>
  <div class="field">
    <label for="password_confirm">Confirm password</label>
    <input
      type="password"
      id="password_confirm"
      name="password_confirm"
      autocomplete="new-password"
      minlength="8"
      aria-describedby="password-hint"
      required
    >
  </div>
  <button type="submit">Create account</button>
</form>

<p class="auth-alt">Already have an account? <a href="/signin">Sign in</a>.</p>
{{end}}
{{end}}
